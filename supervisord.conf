[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# Processo de inicialização Laravel
[program:laravel-init]
command=/bin/bash /var/www/html/init.sh
autostart=true
user=root
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=false
priority=100

# Servidor Laravel
[program:laravel-server]
command=php artisan serve --host=0.0.0.0 --port=8007 --no-reload
directory=/var/www/html
user=www-data
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
startretries=3
stopsignal=TERM
killasgroup=true
stopasgroup=true
stopwaitsecs=10
priority=200

# Laravel Queue Worker (para processar jobs)
[program:laravel-queue]
command=php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=60
directory=/var/www/html
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
numprocs=1
redirect_stderr=true
stopwaitsecs=3600
priority=300

# Schedule Runner (para Laravel Scheduler)
[program:laravel-scheduler]
command=/bin/bash -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
directory=/var/www/html
user=www-data
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stopasgroup=true
killasgroup=true
priority=400

# Grupo de processos
[group:laravel-app]
programs=laravel-init,laravel-server,laravel-queue,laravel-scheduler
priority=100
