# =============================================================================
# Docker Compose para Laravel 10 F2B API
# =============================================================================
# Este arquivo configura a aplicação Laravel 10 com otimizações
# Inclui cache Redis, Traefik e Dokploy
# =============================================================================

services:
  # ==========================================================================
  # APLICAÇÃO LARAVEL 10 F2B API
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f2b-api-laravel10
    restart: unless-stopped
    ports:
      - "8007:8007"
    environment:
      # Configurações Laravel 10
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://f2b.guilhermeviana.com
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=error
      
      # Banco de dados (configurações corretas para Docker)
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-f2b-mysql}
      - DB_USERNAME=${DB_USERNAME:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-476de5e30f4c3efffd73879125503321}
      
      # MongoDB (usando variáveis do .env)
      - DB_MONGO_HOST=${DB_MONGO_HOST:-mongodb}
      - DB_MONGO_PORT=${DB_MONGO_PORT:-27017}
      - DB_MONGO_DATABASE=${DB_MONGO_DATABASE:-f2b}
      - DB_MONGO_USERNAME=${DB_MONGO_USERNAME:-admin}
      - DB_MONGO_PASSWORD=${DB_MONGO_PASSWORD}
      - DB_MONGO_AUTHDATABASE=${DB_MONGO_AUTHDATABASE:-admin}

      
      # Cache Redis para melhor performance
      - REDIS_HOST=redis
      - REDIS_PASSWORD=
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      
      # Configurações de Performance Laravel 10
      - FILESYSTEM_DISK=local
      - BROADCAST_DRIVER=log
      - SESSION_LIFETIME=120
      - SANCTUM_STATEFUL_DOMAINS=f2b.guilhermeviana.com
      
      # Email
      - MAIL_MAILER=smtp
      - MAIL_HOST=sandbox.smtp.mailtrap.io
      - MAIL_PORT=2525
      - MAIL_USERNAME=3a92a391c62821
      - MAIL_PASSWORD=2e52d84bf00140
      - MAIL_ENCRYPTION=tls
      
    volumes:
      # Manter dados importantes persistentes
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
      - ./storage/datasets:/var/www/html/storage/datasets
      - ./storage/oauth-private.key:/var/www/html/storage/oauth-private.key
      - ./storage/oauth-public.key:/var/www/html/storage/oauth-public.key
    
    networks:
      - f2b-network
      - traefik
    
    depends_on:
      - redis
    
    # Labels para Traefik (Dokploy gerencia automaticamente)
    labels:
      # Habilitar Traefik
      - "traefik.enable=true"
      
      # Porta interna do container
      - "traefik.http.services.f2b-api.loadbalancer.server.port=8007"
      
      # Domínio para roteamento
      - "traefik.http.routers.f2b-api.rule=Host(`f2b.guilhermeviana.com`)"
      - "traefik.http.routers.f2b-api.entrypoints=websecure"
      - "traefik.http.routers.f2b-api.tls=true"
      - "traefik.http.routers.f2b-api.tls.certresolver=letsencrypt"
    
    # Verificação de saúde melhorada
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8007/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    # Limites de recursos
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ==========================================================================
  # REDIS CACHE (para melhor performance do Laravel 10)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: f2b-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - f2b-network
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

# =============================================================================
# VOLUMES PARA PERSISTÊNCIA DE DADOS
# =============================================================================
volumes:
  app_storage:
    driver: local
  app_logs:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# DEFINIÇÃO DE REDES
# =============================================================================
networks:
  f2b-network:
    driver: bridge
  traefik:
    external: true
