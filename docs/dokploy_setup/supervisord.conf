[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# Processo de inicialização Laravel
[program:laravel-init]
command=/bin/bash /var/www/html/init.sh
autostart=true
user=root
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=false
priority=100

# Servidor Laravel
[program:laravel-server]
command=php artisan serve --host=0.0.0.0 --port=8000 --no-reload
directory=/var/www/html
user=www-data
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
startretries=3
stopsignal=TERM
killasgroup=true
stopasgroup=true
stopwaitsecs=10
priority=200

# Grupo de processos
[group:laravel-app]
programs=laravel-init,laravel-server
priority=100